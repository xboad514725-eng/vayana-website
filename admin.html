<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vayana | Admin Dashboard</title>

<style>
:root{
  --bg:#f5f6f8;
  --card:#fff;
  --dark:#151515;
  --muted:#8a8f98;
  --red:#e63946;
  --green:#168653;
  --orange:#d88722;
  --border:#eceef1;
  --sidebar:250px;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{background:var(--bg);color:var(--dark);min-height:100vh}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  background:white;
  width:100%;
  max-width:420px;
  padding:40px 30px;
  border-radius:20px;
  box-shadow:0 12px 45px rgba(0,0,0,.06);
}

.logo{
  font-size:30px;
  font-weight:bold;
  letter-spacing:3px;
  text-align:center;
}

.logo span{color:var(--red)}

.login-subtitle{
  text-align:center;
  color:var(--muted);
  margin:10px 0 35px;
  font-size:13px;
}

.login-card h2{margin-bottom:10px}

.login-card p.description{
  color:var(--muted);
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}

input,select,textarea{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:white;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--red);
}

.login-card input{margin-bottom:20px;padding:15px}

.primary-btn{
  background:var(--dark);
  color:white;
  border:0;
  padding:13px 18px;
  border-radius:10px;
  font-weight:bold;
}

.primary-btn:disabled{opacity:.5}

#loginBtn{width:100%;padding:15px}

#loginMessage{
  margin-top:15px;
  font-size:13px;
  text-align:center;
  line-height:1.6;
}

.success{color:var(--green)}
.error{color:var(--red)}

.login-footer{
  text-align:center;
  margin-top:30px;
  color:#aaa;
  font-size:11px;
}

/* DASHBOARD LAYOUT */

.dashboard{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:var(--sidebar);
  background:#151515;
  color:white;
  position:fixed;
  inset:0 auto 0 0;
  padding:25px 16px;
  display:flex;
  flex-direction:column;
  z-index:20;
  overflow-y:auto;
}

.sidebar .logo{
  text-align:left;
  padding:0 12px;
  margin-bottom:8px;
}

.sidebar-subtitle{
  color:#858585;
  font-size:11px;
  padding:0 12px;
  margin-bottom:35px;
  letter-spacing:1px;
}

.nav-label{
  color:#777;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1.5px;
  padding:12px;
}

.nav-btn{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#bcbcbc;
  padding:13px 12px;
  border-radius:9px;
  margin-bottom:4px;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:12px;
}

.nav-btn:hover,.nav-btn.active{
  background:#292929;
  color:white;
}

.nav-btn.active{border-left:3px solid var(--red)}

.nav-icon{
  width:20px;
  text-align:center;
  font-size:16px;
}

.sidebar-bottom{
  margin-top:auto;
  border-top:1px solid #333;
  padding-top:15px;
}

.admin-label{
  color:#aaa;
  font-size:11px;
  padding:10px 12px;
  overflow-wrap:anywhere;
}

.logout-btn{
  width:100%;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#292929;
  color:white;
  text-align:left;
}

.main{
  margin-left:var(--sidebar);
  width:calc(100% - var(--sidebar));
  min-width:0;
}

.topbar{
  background:white;
  height:75px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:10;
}

.topbar h2{font-size:19px}

.topbar-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.status-indicator{
  font-size:12px;
  color:var(--green);
  background:#e9f7ef;
  padding:8px 12px;
  border-radius:30px;
}

.refresh-btn{
  border:1px solid var(--border);
  background:white;
  padding:9px 13px;
  border-radius:9px;
}

.content{padding:30px}

.page-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.page-header h1{font-size:24px;margin-bottom:7px}

.page-header p{color:var(--muted);font-size:13px}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  margin-bottom:25px;
}

.stat-card{
  background:white;
  padding:22px;
  border-radius:14px;
  border:1px solid var(--border);
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.stat-icon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#fff0f0;
  font-size:18px;
}

.stat-card h3{
  font-size:27px;
  margin-bottom:5px;
}

.stat-card p{
  font-size:12px;
  color:var(--muted);
}

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:22px;
  overflow:hidden;
}

.panel-header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--border);
}

.panel-header h3{font-size:15px}

.panel-body{padding:20px}

.table-wrap{overflow-x:auto}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th{
  text-align:left;
  padding:14px 15px;
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  background:#fafafa;
  border-bottom:1px solid var(--border);
}

td{
  padding:15px;
  font-size:12px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
}

tr:last-child td{border-bottom:0}

.muted{color:var(--muted)}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
  background:#f0f1f3;
  color:#555;
}

.badge.pending{background:#fff4df;color:#b87916}
.badge.confirmed,.badge.paid,.badge.completed{background:#e5f7ed;color:#168653}
.badge.cancelled,.badge.rejected{background:#ffebeb;color:#d33b3b}
.badge.in_progress{background:#eaf1ff;color:#3569bb}
.badge.open{background:#e5f7ed;color:#168653}
.badge.closed{background:#eee;color:#666}

.small-btn{
  border:1px solid var(--border);
  background:white;
  padding:8px 10px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
}

.small-btn:hover{border-color:var(--red)}

.danger-btn{
  background:#fff0f0;
  color:#c93636;
  border:0;
  padding:9px 12px;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
}

.green-btn{
  background:#e8f7ef;
  color:#168653;
  border:0;
  padding:9px 12px;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.filters select,.filters input{
  width:auto;
  min-width:150px;
  font-size:12px;
  padding:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:30px;
  color:var(--muted);
  font-size:13px;
}

.notice{
  padding:13px 15px;
  border-radius:9px;
  margin-bottom:15px;
  font-size:12px;
  line-height:1.6;
}

.notice.warning{background:#fff6e7;color:#98651c}
.notice.error{background:#fff0f0;color:#b92e2e}
.notice.success{background:#e9f7ef;color:#168653}

.status-select{
  min-width:125px;
  padding:8px;
  font-size:11px;
}

.action-cell{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.search-input{max-width:250px}

.detail-box{
  background:#fafafa;
  border:1px solid var(--border);
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
  font-size:12px;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.chat-layout{
  display:grid;
  grid-template-columns:300px minmax(0,1fr);
  min-height:480px;
}

.chat-list{
  border-right:1px solid var(--border);
  max-height:600px;
  overflow-y:auto;
}

.chat-item{
  padding:16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.chat-item:hover,.chat-item.selected{background:#fff5f5}

.chat-item strong{font-size:12px}

.chat-item p{
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
}

.chat-window{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-messages{
  flex:1;
  min-height:350px;
  max-height:480px;
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.message{
  max-width:80%;
  padding:12px;
  border-radius:12px;
  background:#f0f1f3;
  font-size:12px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.message.admin{
  background:#202020;
  color:white;
  align-self:flex-end;
}

.message small{
  display:block;
  opacity:.6;
  margin-top:7px;
  font-size:9px;
}

.chat-compose{
  border-top:1px solid var(--border);
  padding:15px;
  display:flex;
  gap:10px;
}

.chat-compose input{flex:1;min-width:0}

.chat-compose button{
  border:0;
  background:#151515;
  color:white;
  padding:0 20px;
  border-radius:9px;
}

.mobile-menu{display:none}

#toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#171717;
  color:white;
  padding:14px 18px;
  border-radius:10px;
  font-size:12px;
  z-index:100;
  display:none;
  max-width:90%;
}

@media(max-width:1100px){
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:750px){
  :root{--sidebar:0px}

  .sidebar{
    width:250px;
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{transform:translateX(0)}

  .main{margin-left:0;width:100%}

  .topbar{padding:0 15px;height:65px}

  .topbar h2{font-size:16px}

  .mobile-menu{
    display:block;
    border:0;
    background:#f1f1f1;
    padding:9px 12px;
    border-radius:8px;
    margin-right:10px;
  }

  .topbar-left{display:flex;align-items:center}

  .content{padding:18px 12px}

  .stats-grid{gap:10px}

  .stat-card{padding:15px}

  .stat-card h3{font-size:23px}

  .stat-card p{font-size:10px}

  .chat-layout{grid-template-columns:1fr}

  .chat-list{
    border-right:0;
    border-bottom:1px solid var(--border);
    max-height:220px;
  }

  .chat-messages{min-height:250px}

  .search-input{max-width:100%}

  .topbar-right .status-indicator{display:none}
}

</style>
</head>

<body>

<!-- LOGIN -->

<section class="login-screen" id="loginScreen">

  <div class="login-card">

    <div class="logo">VA<span>Y</span>ANA</div>
    <div class="login-subtitle">ADMINISTRATION PORTAL</div>

    <h2>Welcome Back</h2>

    <form id="loginForm">

</section>


<!-- DASHBOARD -->

<div class="dashboard hidden" id="dashboard">

  <aside class="sidebar" id="sidebar">

    <div class="logo">VA<span>Y</span>ANA</div>
    <div class="sidebar-subtitle">ADMINISTRATION SYSTEM</div>

    <div class="nav-label">MAIN MENU</div>

    <button class="nav-btn active" data-page="overview">
      <span class="nav-icon">▦</span> Overview
    </button>

    <button class="nav-btn" data-page="tour">
      <span class="nav-icon">✈</span> Tour Requests
    </button>

    <button class="nav-btn" data-page="transportation">
      <span class="nav-icon">🚘</span> Transportation
    </button>

    <button class="nav-btn" data-page="felucca">
      <span class="nav-icon">⛵</span> Felucca
    </button>
    <button class="nav-btn" data-page="flight"><span class="nav-icon">✈</span> Flight Requests</button>
    <button class="nav-btn" data-page="stay"><span class="nav-icon">⌂</span> Stay Requests</button>
    <button class="nav-btn" data-page="offers"><span class="nav-icon">✧</span> Offers</button>
    <button class="nav-btn" data-page="gifts"><span class="nav-icon">🎁</span> Gift Requests</button>

    <button class="nav-btn" data-page="customer_service">
      <span class="nav-icon">♧</span> Customer Service
    </button>

    <div class="nav-label">MANAGEMENT</div>

    <button class="nav-btn" data-page="customers">
      <span class="nav-icon">♙</span> Customers
    </button>

    <button class="nav-btn" data-page="payments">
      <span class="nav-icon">＄</span> Payment Verification
    </button>

    <button class="nav-btn" data-page="chats">
      <span class="nav-icon">✉</span> Customer Chats
    </button>

    <div class="sidebar-bottom">

      <div class="admin-label" id="adminEmail">Administrator</div>

      <button class="logout-btn" id="logoutBtn">

      </button>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="topbar-left">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <h2 id="pageTitle">Overview</h2>
      </div>

      <div class="topbar-right">
        <span class="status-indicator">● System Connected</span>
        <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
      </div>

    </header>


    <section class="content" id="pageContent">

      <div class="loading">Loading dashboard...</div>

    </section>

  </main>

</div>


<div id="toast"></div>


<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";


/* =====================================================
   CONFIGURATION
===================================================== */

const SUPABASE_URL =
"https://dmkxyfvmyemovuhcyuop.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wujNpox7yzgtSQMludA2qA_6cu2tDHZ";

const API_URL =
"https://dmkxyfvmyemovuhcyuop.supabase.co/functions/v1/vayana-api";

const ADMIN_ID =
"844e0479-b45c-465f-bc4a-8f42334d673b";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen = document.getElementById("loginScreen");
const dashboard = document.getElementById("dashboard");
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const loginMessage = document.getElementById("loginMessage");
const pageContent = document.getElementById("pageContent");
const pageTitle = document.getElementById("pageTitle");
const sidebar = document.getElementById("sidebar");

let currentSession = null;
let currentPage = "overview";
let currentChatId = null;
let currentChatStatus = "open";
let cachedStats = {};


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);

}


function showToast(message){

  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    toast.style.display = "none";
  },3500);

}


function showLoginMessage(message,type="error"){

  loginMessage.textContent = message;
  loginMessage.className = type;

}


function dateFormat(value){

  if(!value) return "—";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())) return escapeHTML(value);

  return date.toLocaleString("en-GB",{
    dateStyle:"medium",
    timeStyle:"short"
  });

}


function dateOnly(value){

  if(!value) return "—";

  const date = new Date(value+"T00:00:00");

  if(Number.isNaN(date.getTime())) return escapeHTML(value);

  return date.toLocaleDateString("en-GB");

}


function badge(status){

  const value = String(status || "unknown").toLowerCase();

  return `
    <span class="badge ${escapeHTML(value)}">
      ${escapeHTML(value.replaceAll("_"," "))}
    </span>
  `;

}


function statusOptions(current){

  const statuses = [
    "pending",
    "confirmed",
    "in_progress",
    "completed",
    "cancelled",
    "rejected"
  ];

  return statuses.map(status=>`
    <option value="${status}" ${status===current?"selected":""}>
      ${status.replaceAll("_"," ")}
    </option>
  `).join("");

}


function customerName(row){

  return row.customers?.full_name || row.full_name || "Unknown";

}


function customerEmail(row){

  return row.customers?.email || row.email || "—";

}


function customerPhone(row){

  return row.customers?.phone || row.phone || "—";

}


function showLoading(){

  pageContent.innerHTML = `
    <div class="loading">Loading data...</div>
  `;

}


function showError(message){

  pageContent.innerHTML = `
    <div class="notice error">
      ${escapeHTML(message)}
    </div>
  `;

}


function renderTable(headers,rows){

  if(!rows.length){

    return `
      <div class="empty">No records found.</div>
    `;

  }

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>
        </thead>
        <tbody>${rows.join("")}</tbody>
      </table>
    </div>
  `;

}


/* =====================================================
   API REQUESTS
===================================================== */

async function api(action,data={}){

  if(!currentSession?.access_token){

    throw new Error("Your login session has expired. Please sign in again.");

  }

  const response = await fetch(API_URL,{

    method:"POST",

    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+currentSession.access_token
    },

    body:JSON.stringify({
      action,
      ...data
    })

  });

  const result = await response.json();

  if(!response.ok || result.status==="error"){

    throw new Error(result.message || "API request failed.");

  }

  return result;

}


/* =====================================================
   AUTHENTICATION
===================================================== */

async function checkSession(){

  const {data,error} = await supabase.auth.getSession();

  if(error || !data.session){

    showLogin();
    return;

  }

  currentSession = data.session;

  if(currentSession.user.id !== ADMIN_ID){

    await supabase.auth.signOut();

    showLoginMessage(
      "This account is not authorized.",
      "error"
    );

    return;

  }

  await openDashboard();

}


function showLogin(){

  loginScreen.classList.remove("hidden");
  dashboard.classList.add("hidden");

}


async function openDashboard(){

  const {data,error} = await supabase.auth.getSession();

  if(error || !data.session){

    showLogin();
    return;

  }

  currentSession = data.session;

  loginScreen.classList.add("hidden");
  dashboard.classList.remove("hidden");

  document.getElementById("adminEmail").textContent =
    currentSession.user.email || "Administrator";

  await loadPage("overview");

}


loginForm.addEventListener("submit",async event=>{

  event.preventDefault();

  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try{

    const {data,error} = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    if(data.user.id !== ADMIN_ID){

      await supabase.auth.signOut();

      throw new Error("Unauthorized administrator account.");

    }

    currentSession = data.session;

    showLoginMessage("Login successful.","success");

    await openDashboard();

  }catch(error){

    showLoginMessage(error.message,"error");

  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";

  }

});


document.getElementById("logoutBtn").addEventListener("click",async()=>{

  await supabase.auth.signOut();

  currentSession = null;

  dashboard.classList.add("hidden");
  loginScreen.classList.remove("hidden");

  loginForm.reset();

  showLoginMessage("Signed out successfully.","success");

});


supabase.auth.onAuthStateChange((event,session)=>{

  if(event==="SIGNED_OUT"){

    currentSession = null;

    dashboard.classList.add("hidden");
    loginScreen.classList.remove("hidden");

===================================================== */

const pageNames = {

  overview:"Overview",
  tour:"Tour Requests",
  transportation:"Transportation Requests",
  felucca:"Felucca Requests",
  flight:"Flight Requests",
  stay:"Stay Requests",
  offers:"Offer Bookings",
  gifts:"Gift Requests",
  customer_service:"Customer Service",
  customers:"Customers",
  payments:"Payment Verification",
  chats:"Customer Chats"

};


document.querySelectorAll(".nav-btn").forEach(button=>{

  button.addEventListener("click",()=>{

    document.querySelectorAll(".nav-btn").forEach(btn=>{
      btn.classList.remove("active");
    });

    button.classList.add("active");

    sidebar.classList.remove("open");

    loadPage(button.dataset.page);

  });

});


document.getElementById("mobileMenu").addEventListener("click",()=>{

  sidebar.classList.toggle("open");

});


document.getElementById("refreshBtn").addEventListener("click",()=>{

  loadPage(currentPage);

});


async function loadPage(page){

  currentPage = page;

  pageTitle.textContent = pageNames[page] || "Dashboard";

  showLoading();

  try{

    switch(page){

      case "overview":
        await renderOverview();
        break;

      case "tour":
        await renderRequests("tour");
        break;

      case "transportation":
        await renderRequests("transportation");
        break;

      case "felucca":
        await renderRequests("felucca");
        break;
      case "flight":
        await renderRequests("flight");
        break;
      case "stay":
        await renderRequests("stay");
        break;
      case "offers":
        await renderOfferRequests();
        break;
      case "gifts":
        await renderGiftRequests();
        break;

      case "customer_service":
        await renderRequests("customer_service");
        break;

      case "customers":
        await renderCustomers();
        break;

      case "payments":
        await renderPayments();
        break;

      case "chats":
        await renderChats();
        break;

      default:
        showError("Page not found.");

    }

  }catch(error){

    showError(error.message);

  }

}

async function renderRequests(type){

  let result;

  if(type==="felucca"){

    result = await api("list_requests",{
      request_type:"transportation",
      limit:100,
      offset:0
    });

    result.requests = (result.requests || []).filter(row=>
      String(row.service_type || "").toLowerCase().includes("felucca")
    );

  }else{

    result = await api("list_requests",{
      request_type:type,
      limit:100,
      offset:0
    });

  }


  const requests = result.requests || [];

  const title = pageNames[type];

  let rows = requests.map(row=>{

    let details = "—";

    if(type==="tour"){

      details = `
        ${escapeHTML(row.package_name || "—")}
        <br>
        <span class="muted">
          Arrival: ${dateOnly(row.arrival_date)}
          <br>
          Departure: ${dateOnly(row.departure_date)}
          <br>
          Tour: ${dateOnly(row.preferred_tour_date)}
        </span>
      `;

    }

    if(type==="transportation"){

      details = `
        ${escapeHTML(row.service_type || "—")}
        <br>
        <span class="muted">
          ${escapeHTML(row.pickup_location || "—")}
          → ${escapeHTML(row.dropoff_location || "—")}
          <br>
          Pickup: ${dateOnly(row.pickup_date)} · Drop-off: ${dateOnly(row.dropoff_date)}
        </span>
      `;

    }

    if(type==="felucca"){

      details = `
        Felucca
        <br>
        <span class="muted">
          Date: ${dateOnly(row.pickup_date)}
          <br>
          Passengers: ${Number(row.passengers || 0)}
        </span>
      `;

    }

    if(type==="flight"){
      details = `
        ${escapeHTML(row.trip_type || "Flight enquiry")}
        <br><span class="muted">${escapeHTML(row.departure_city || "—")} → ${escapeHTML(row.arrival_city || "—")}
        <br>Departure: ${dateOnly(row.departure_date)} · Return: ${dateOnly(row.return_date)}
        <br>Passengers: ${Number(row.passengers || 1)} · Cabin: ${escapeHTML(row.cabin_class || "economy")}</span>`;
    }
    if(type==="stay"){
      details = `
        ${escapeHTML(row.hotel_category || "Accommodation")}
        <br><span class="muted">${escapeHTML(row.hotel_name || row.preferred_area || "Area not specified")}
        <br>Check-in: ${dateOnly(row.check_in_date)} · Check-out: ${dateOnly(row.check_out_date)}
        <br>Guests: ${Number(row.guests || 1)} · Rooms: ${Number(row.rooms || 1)} · Meal plan: ${escapeHTML(row.meal_plan || "—")}</span>`;
    }

    if(type==="customer_service"){

      details = `
        ${Number(row.service_days || 0)} days
        <br>
        <span class="muted">
          Start: ${dateOnly(row.service_start_date)}
          <br>
          Payment: ${escapeHTML(row.payment_status || "—")}
        </span>
      `;

    }


    const updateType = type==="felucca" ? "transportation" : type;

    return `

      <tr>

        <td>
          <strong>${escapeHTML(customerName(row))}</strong>
          <br>
          <span class="muted">${escapeHTML(customerEmail(row))}</span>
          <br>
          <span class="muted">${escapeHTML(customerPhone(row))}</span>
        </td>

        <td>${details}</td>

        <td>${badge(row.status)}</td>

        <td>${dateFormat(row.created_at)}</td>

        <td>

          <div class="action-cell">

            <select
              class="status-select"
              data-status-id="${escapeHTML(row.id)}"
              data-status-type="${escapeHTML(updateType)}"
            >
              ${statusOptions(row.status)}
            </select>

            <button
              class="small-btn"
              data-update-status="${escapeHTML(row.id)}"
              data-update-type="${escapeHTML(updateType)}"
            >
              Update
            </button>

          </div>

        </td>

      </tr>

    `;

  });


  pageContent.innerHTML = `

    <div class="page-header">

      <div>
        <h1>${escapeHTML(title)}</h1>
        <p>Manage and update customer requests.</p>
      </div>

      <div class="filters">

        <select id="requestFilter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
          <option value="rejected">Rejected</option>
        </select>

      </div>

    </div>


    <div class="panel">

      <div class="panel-header">

        <h3>${requests.length} Requests Loaded</h3>

        <span class="muted" style="font-size:11px">
          Maximum 100 records
        </span>

      </div>

      ${renderTable(
        ["Customer","Request Details","Status","Created At","Actions"],
        rows
      )}

    </div>

  `;


  document.getElementById("requestFilter").addEventListener("change",event=>{

    const filter = event.target.value;

    const filtered = requests.filter(row=>
      !filter || row.status===filter
    );

    const newRows = filtered.map(row=>{

      const tr = pageContent.querySelector(
        `[data-update-status="${row.id}"]`
      )?.closest("tr");

      return tr ? tr.outerHTML : "";

    });

    const tbody = pageContent.querySelector("tbody");

    if(tbody){

      tbody.innerHTML = newRows.filter(Boolean).length
        ? newRows.filter(Boolean).join("")
        : `<tr><td colspan="5" class="empty">No matching requests.</td></tr>`;

    }

  });


  pageContent.querySelectorAll("[data-update-status]").forEach(button=>{

    button.addEventListener("click",async()=>{

      const id = button.dataset.updateStatus;
      const requestType = button.dataset.updateType;

      const select = pageContent.querySelector(
        `[data-status-id="${id}"]`
      );

      const newStatus = select.value;

      button.disabled = true;
      button.textContent = "Saving...";

      try{

        await api("update_request_status",{
          request_type:requestType,
          request_id:id,
          new_status:newStatus
        });

        showToast("Request status updated.");

        await loadPage(currentPage);

      }catch(error){

        showToast(error.message);

        button.disabled = false;
        button.textContent = "Update";

      }

    });

  });

}

              disabled
            >

            <button type="submit" id="chatSendBtn" disabled>
              Send
            </button>

          </form>

        </div>

      </div>

    </div>

  `;


  pageContent.querySelectorAll("[data-chat-id]").forEach(item=>{

    item.addEventListener("click",()=>{

      pageContent.querySelectorAll(".chat-item").forEach(chat=>{
        chat.classList.remove("selected");
      });

      item.classList.add("selected");

      loadChat(item.dataset.chatId);

    });

  });


  document.getElementById("chatFilter").addEventListener("change",async event=>{

    try{

      const filtered = await api("list_chats",{
        limit:100,
        offset:0,
        status:event.target.value
      });

      const list = document.getElementById("chatList");

      list.innerHTML = (filtered.conversations || []).map(chat=>`

        <div class="chat-item" data-chat-id="${escapeHTML(chat.id)}">

          <strong>${escapeHTML(chat.customers?.full_name || "Unknown Customer")}</strong>

          <p>${escapeHTML(chat.chat_type || "Chat")}</p>

          <p>${badge(chat.status)} &nbsp; ${dateFormat(chat.created_at)}</p>

        </div>

      `).join("") || `<div class="empty">No conversations found.</div>`;

      list.querySelectorAll("[data-chat-id]").forEach(item=>{

        item.addEventListener("click",()=>{

          list.querySelectorAll(".chat-item").forEach(chat=>{
            chat.classList.remove("selected");
          });

          item.classList.add("selected");

          loadChat(item.dataset.chatId);

        });

      });

    }catch(error){

      showToast(error.message);

    }

  });


  document.getElementById("chatForm").addEventListener("submit",async event=>{

    event.preventDefault();

    if(!currentChatId) return;

    const input = document.getElementById("chatMessage");
    const message = input.value.trim();

    if(!message) return;

    const sendBtn = document.getElementById("chatSendBtn");

    sendBtn.disabled = true;

    try{

      await api("reply_chat",{
        conversation_id:currentChatId,
        message
      });

      input.value = "";

      await loadChat(currentChatId);

      showToast("Reply sent.");

    }catch(error){

      showToast(error.message);

    }finally{

      sendBtn.disabled = false;

    }

  });


  document.getElementById("chatStatusBtn").addEventListener("click",async()=>{

    if(!currentChatId) return;

    const newStatus = currentChatStatus==="open" ? "closed" : "open";

    try{

      await api("update_chat_status",{
        conversation_id:currentChatId,
        status:newStatus
      });

      showToast("Conversation status updated.");

      await loadPage("chats");

    }catch(error){

      showToast(error.message);

    }

  });

}


async function loadChat(id){

  currentChatId = id;

  const messagesBox = document.getElementById("chatMessages");

  messagesBox.innerHTML = `<div class="loading">Loading messages...</div>`;

  try{

    const result = await api("get_chat_messages",{
      conversation_id:id
    });

    const conversation = result.conversation;

    currentChatStatus = conversation.status;

    document.getElementById("chatTitle").textContent =
      conversation.chat_type || "Customer Conversation";

    const statusButton = document.getElementById("chatStatusBtn");

    statusButton.classList.remove("hidden");

    statusButton.textContent =
      currentChatStatus==="open" ? "Close Chat" : "Reopen Chat";


    const messages = result.messages || [];

    messagesBox.innerHTML = messages.length
      ? messages.map(message=>`

        <div class="message ${message.sender_type==="admin"?"admin":""}">

          ${escapeHTML(message.message)}

          <small>
            ${escapeHTML(message.sender_type)}
            · ${dateFormat(message.created_at)}
          </small>

        </div>

      `).join("")
      : `<div class="empty">No messages yet.</div>`;


    messagesBox.scrollTop = messagesBox.scrollHeight;

    const input = document.getElementById("chatMessage");
    const send = document.getElementById("chatSendBtn");

    input.disabled = currentChatStatus!=="open";
    send.disabled = currentChatStatus!=="open";

    input.placeholder = currentChatStatus==="open"
      ? "Write your reply..."
      : "This conversation is closed.";

  }catch(error){

    messagesBox.innerHTML = `
      <div class="notice error">
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


/* =====================================================
   START
===================================================== */

checkSession();

</script>
